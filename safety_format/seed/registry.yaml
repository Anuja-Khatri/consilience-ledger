version: safety-seed-v0
# Benign public-standard EHS seed only (CC-31). Instrument protection bounds,
# consumables budgets, and standard laboratory incompatible-chemical classes from
# widely published general safety references. No synthesis content, no dual-use content.
# Each rule carries a grade (established, plausible, weakly_supported) and a source.
rules:
  - id: SB1
    kind: bound
    grade: established
    source: "General furnace instrument protection limit (public instrument specifications)."
    plain_english: Anneal temperature must not exceed the furnace protection limit.
    bound: {var: anneal_temp_c, op: "<=", value: 1100}
  - id: SB2
    kind: bound
    grade: established
    source: "Potentiostat compliance / instrument protection (public instrument specifications)."
    plain_english: Applied current density must not exceed the instrument compliance limit.
    bound: {var: current_density_ma_cm2, op: "<=", value: 1000}
  - id: SB3
    kind: bound
    grade: plausible
    source: "Consumables budget per run (internal benign operating policy)."
    plain_english: Acid volume per run must stay within the consumables budget.
    bound: {var: acid_ml, op: "<=", value: 500}
  - id: SC1
    kind: forbid_combo
    grade: established
    source: "Standard laboratory incompatible-chemical classes (public general safety references)."
    plain_english: Do not combine a strong oxidizer with an organic solvent.
    forbid_combo: {classes: [strong_oxidizer, organic_solvent]}
  - id: SC2
    kind: forbid_combo
    grade: established
    source: "Standard laboratory incompatible-chemical classes (public general safety references)."
    plain_english: Do not combine a strong acid with a strong base in the same vessel.
    forbid_combo: {classes: [strong_acid, strong_base]}
  - id: SC3
    kind: forbid_combo
    grade: plausible
    source: "Standard laboratory incompatible-chemical classes (public general safety references)."
    plain_english: Do not add a water-reactive reagent to an aqueous mixture.
    forbid_combo: {classes: [water_reactive, aqueous]}
