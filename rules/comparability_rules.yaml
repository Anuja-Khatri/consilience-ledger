version: comparability-v0.1
# CP1 section 5 (Anu-confirmed): canonical maps locked into v0.
canonical:
  # CR1 electrolyte identity equality is by canonical identity, never a string accident.
  electrolyte_identities:
    h2so4: sulfuric_acid
    "sulfuric acid": sulfuric_acid
    sulphuric_acid: sulfuric_acid
    hclo4: perchloric_acid
    "perchloric acid": perchloric_acid
  # CR2/CR3 units canonicalise through pint after this spelling normalisation (note:
  # the authoritative alias map is labext/units.UNIT_ALIASES; mirrored here for the lock).
  unit_canonicalization_note: >
    Temperature "C" is normalised to degC before pint (pint reads bare C as coulomb);
    mA/cm^2 and A/cm^2 spelling variants, umol/cm^2, mg/cm^2, and mol/L are normalised
    before the predicate runs.
# Default-deny comparability rules (spec IV.2). A pair of overpotential/stability
# claims is comparable only if EVERY rule's field is stated on both claims AND the
# predicate passes. Any unstated required field -> condition_unstated(field); any
# failed predicate -> condition_mismatch(rule_id).
#
# Page-level citations ported from ../ledger-v2 (r0/GATE1.md, approved at Gate 1) for the
# matching FIELDS (v0.1, DOCUMENTATION-ONLY: fields/predicates/tolerances and numbering are
# UNCHANGED from v0, so no verdict changes; see rules/CHANGELOG.md). Note CR3/CR4 numbering
# differs from ledger-v2 (there CR3=iR, CR4=temperature); citations are matched by field.
rules:
  - id: CR1
    fields: [electrolyte]
    predicate: identity_and_concentration_equal
    plain_english: Two claims are comparable only in the same electrolyte at the same concentration.
    rationale: Electrolyte identity and concentration set the reaction environment; ESAMP state-equivalency groups by them.
    source: 'B2 (PMC13707403, Molecules 2026), abstract: comparability asserted only "on a matched basis (1 M KOH, room temperature)" (ported from ../ledger-v2 r0/GATE1.md, Gate-1 approved).'
  - id: CR2
    fields: [current_density]
    predicate: {name: equal_within, params: {tolerance: 0}}
    plain_english: Overpotentials are comparable only at the same current density and the same normalisation (geometric vs ECSA).
    rationale: Overpotential is reported at a current density; ECSA- and geometric-normalised densities are not interchangeable (CC-06).
    source: 'B2 (PMC13707403, Molecules 2026), section 3.2 "The 10 mA cm-2 Benchmark": divergence "by more than 150 mV at 100 mA cm-2" relative to 10 mA cm-2 (ported from ../ledger-v2 r0/GATE1.md, Gate-1 approved).'
  - id: CR3
    fields: [temperature]
    predicate: {name: temperature_equal, params: {tolerance: 0}}
    plain_english: Claims are comparable only at the same temperature; room_temperature matches room_temperature only.
    rationale: Temperature shifts kinetics; room_temperature is an enum, never a number (D10, CC-12).
    source: 'B2 (PMC13707403, Molecules 2026), abstract: the matched basis is explicitly "(1 M KOH, room temperature)" (ported from ../ledger-v2 r0/GATE1.md, Gate-1 approved; ledger-v2 numbers this CR4).'
  - id: CR4
    fields: [ir_correction]
    predicate: enum_equal
    plain_english: Claims are comparable only if both are iR-corrected or both are not.
    rationale: iR correction changes the reported overpotential materially; mixing corrected and uncorrected values is not comparable.
    source: 'B2 (PMC13707403, Molecules 2026), section 3: a RuO2 electrode''s overpotential at 25 mA cm-2 "slid continuously from 437 mV uncompensated down to 382 mV at full compensation, depending on which fraction the author chose" (ported from ../ledger-v2 r0/GATE1.md, Gate-1 approved; ledger-v2 numbers this CR3. This repo keeps its v0 enum_equal predicate unchanged).'
